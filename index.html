{% assign about = site.data.about %}

<header>

	<img src="./assets/images/headshot_optimized.webp" class="headshot-img">

	<div class="header-info">

		<h2>{{ about.name }}</h2>
		
		<p>{{ about.title }}</p>

		<p>{{ about.location }}</p>

	</div>

	<div class="header-links">

		{% include link_buttons.liquid %}

	</div>

</header>

<div class="divider"></div>

<main>

	<section>

		<h3>About</h3>

		<p>{{ about.description }}</p>

	</section>

	<section>

		<h3>Education</h3>

	</section>

</main>
